name: macOS Apple Silicon

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Python and Tk for Apple Silicon
        run: |
          brew install python@3.12 python-tk@3.12
          echo "$(brew --prefix python@3.12)/bin" >> "$GITHUB_PATH"
          python3.12 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Check macOS runtime and app syntax
        run: |
          python -m compileall -q scripts
          python -c "import av, faster_whisper, imageio_ffmpeg, numpy, playwright, rapidocr_onnxruntime, yt_dlp, tkinter; import subprocess; subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(), '-version'], check=True, stdout=subprocess.DEVNULL)"
          python -c "import sys; from pathlib import Path; sys.path.insert(0, 'scripts'); from install import install_target; assert install_target(Path('/tmp/codex-home'), 'darwin') == Path('/tmp/codex-home/.agents/skills/video-rabbit-holes')"

      - name: Build the Mac app bundle
        run: python scripts/package_macos.py --output dist

      - name: Check app launcher and bundle metadata
        run: |
          zsh -n scripts/setup_macos.command
          zsh -n "dist/Video Workbench.app/Contents/MacOS/VideoWorkbench"
          plutil -lint "dist/Video Workbench.app/Contents/Info.plist"

      - name: Check packaged source size
        run: test "$(du -sk "dist/Video Workbench.app" | cut -f1)" -lt 20480

      - name: Create the disk image
        run: |
          mkdir -p stage
          cp -R "dist/Video Workbench.app" stage/
          ln -s /Applications stage/Applications
          hdiutil create -volname "Video Workbench" -srcfolder stage -ov -format UDZO \
            "dist/Video-Workbench-macOS-Apple-Silicon.dmg"
          ditto -c -k --sequesterRsrc --keepParent "dist/Video Workbench.app" \
            "dist/Video-Workbench-macOS-Apple-Silicon.zip"
          cd dist
          shasum -a 256 Video-Workbench-macOS-Apple-Silicon.dmg Video-Workbench-macOS-Apple-Silicon.zip > SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: video-workbench-macos-apple-silicon
          path: |
            dist/Video-Workbench-macOS-Apple-Silicon.dmg
            dist/Video-Workbench-macOS-Apple-Silicon.zip
            dist/SHA256SUMS.txt

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Video-Workbench-macOS-Apple-Silicon.dmg" \
            "dist/Video-Workbench-macOS-Apple-Silicon.zip" \
            "dist/SHA256SUMS.txt" \
            --title "Video Workbench $GITHUB_REF_NAME" \
            --generate-notes
