<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video evidence</title>
<style>
:root{color-scheme:light;--bg:#f6f4ef;--paper:#fffefb;--ink:#292824;--muted:#706d64;--line:#dad6cc;--accent:#9a5238}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:18px 28px;border-bottom:1px solid var(--line);background:var(--paper)}h1,h2{font-family:Georgia,serif;font-weight:400;margin:0 0 10px}h1{font-size:25px}h2{font-size:20px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input,button,select{font:inherit;border:1px solid var(--line);border-radius:7px;padding:8px 12px;background:var(--paper);color:var(--ink)}button{cursor:pointer}button:hover,button.active{border-color:var(--accent);color:var(--accent)}input{flex:1;min-width:180px}
.meta{font-size:13px;color:var(--muted);margin:8px 0}main{display:grid;grid-template-columns:minmax(420px,1.5fr) minmax(300px,1fr);gap:24px;padding:24px 28px}.panel{min-width:0}.media{background:#171715;border-radius:8px;overflow:hidden}video{width:100%;max-height:48vh;display:block}audio{width:100%}.screen{width:100%;display:block;border:1px solid var(--line);cursor:zoom-in;background:white}.warning{color:#8b452e}.scroll{max-height:45vh;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--paper)}.row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px}.row.current{background:#f0e7dc;border-left:3px solid var(--accent)}.time{color:var(--accent);font-size:12px}.ocr{max-height:32vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px;white-space:pre-wrap;font:14px/1.6 "SFMono-Regular",Consolas,monospace}.tiles{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tiles a,a{color:var(--accent)}details{margin:10px 0}#empty{padding:12px;color:var(--muted)}@media(max-width:900px){main{grid-template-columns:1fr}header,main{padding:16px}}
</style>
<header><h1 id="title"></h1><div class="toolbar"><input id="search" placeholder="Search speech and screen text" aria-label="Search speech and screen text"><button id="previous">Previous screen</button><button id="next">Next screen</button><button id="audioButton">Audio</button></div><div id="status" class="meta"></div><details><summary>Coverage</summary><div id="coverage" class="meta"></div><div id="warnings" class="warning"></div></details></header>
<main><section class="panel"><details id="playback"><summary>Playback</summary><div class="media"><video id="video" controls preload="metadata"></video><audio id="audio" controls preload="none" hidden></audio></div></details><div class="meta"><a id="original" target="_blank" rel="noopener">Source</a> · <a href="READ.md">Reading guide</a> · <a href="timeline.md">Timeline</a></div><h2 id="screenTitle">Screen</h2><div id="screenTime" class="meta"></div><a id="imageLink" target="_blank"><img id="screen" class="screen" alt="Screen evidence"></a><div id="tiles" class="tiles"></div><details open><summary>Screen text · OCR</summary><div id="ocr" class="ocr"></div></details></section>
<section class="panel"><h2>Speech</h2><div id="passages" class="scroll"></div><div id="empty" hidden>No matches</div><h2 style="margin-top:24px">Screens</h2><div id="screens" class="scroll" style="max-height:25vh"></div><details><summary>Speech checks</summary><div id="speechChecks" class="meta"></div></details></section></main>
<script>
"use strict";
const data=/*EVIDENCE_DATA*/null;
const el=id=>document.getElementById(id);
const time=s=>{s=Math.max(0,Math.floor(s));return `${Math.floor(s/3600).toString().padStart(2,'0')}:${Math.floor(s/60)%60<10?'0':''}${Math.floor(s/60)%60}:${(s%60).toString().padStart(2,'0')}`};
let selected=0, currentSegment=-1, audioMode=false, query='';
let player=el('video');
el('title').textContent=data.title;document.title=data.title+' | Video evidence';
el('video').src=data.media;el('audio').src=data.audio;
if(/^https:\/\/(www\.)?(youtube\.com|youtu\.be|tiktok\.com)\//.test(data.source_url))el('original').href=data.source_url;
else el('original').removeAttribute('href');
el('status').textContent=`Reading: ${data.status.status.replaceAll('_',' ')} · Review: unreviewed`;
el('coverage').textContent=`${data.status.source_dimensions.join(' × ')} source · ${data.screens.length} screen intervals · ${data.status.sample_count} timeline samples · Maximum sample gap ${data.status.max_sample_gap_seconds.toFixed(2)} s. ${data.status.coverage_note} OCR and speech recognition are unverified. Crops preserve source pixels; they do not restore missing detail.`;
el('warnings').textContent=data.status.warnings.join('\n');
const flags=new Map(data.quality.segment_flags.map(f=>[f.segment_id,f.reasons.join('; ')]));
el('speechChecks').textContent=`${flags.size} passages flagged. ${data.quality.note}\n`+data.quality.audible_transcript_gaps.map(g=>`${time(g.start)} to ${time(g.end)}: ${g.reason}`).join('\n');
const offset=data.status.asr_to_media_offset_seconds||0;
function seek(t){player.currentTime=Math.max(0,t-(audioMode?offset:0));sync(t)}
function showScreen(i){
 selected=Math.min(data.screens.length-1,Math.max(0,i));const s=data.screens[selected];if(!s)return;
 el('screenTitle').textContent=s.id;el('screenTime').textContent=`Interval ${time(s.start)} to ${time(s.end)} · Image ${s.image_timestamp.toFixed(3)} s`;
 el('screen').src=s.image;el('imageLink').href=s.image;el('ocr').textContent=s.ocr_text||'No text recognized';
 el('tiles').replaceChildren();s.tiles.forEach((t,j)=>{const a=document.createElement('a');a.href=t.file;a.target='_blank';a.textContent=`Crop ${j+1}`;a.title=`Source bounds ${t.box.join(', ')}`;el('tiles').append(a)});
 document.querySelectorAll('#screens .row').forEach(b=>{const active=b.dataset.screen===s.id;b.classList.toggle('current',active);if(active)el('screens').scrollTop=b.offsetTop-el('screens').offsetTop});
}
function render(){
 const screenMatches=new Set(data.screens.filter(s=>s.ocr_text.toLowerCase().includes(query)).map(s=>s.id));
 el('passages').replaceChildren();el('screens').replaceChildren();
 for(const s of data.segments){if(query&&!s.text.toLowerCase().includes(query)&&!s.screen_ids.some(id=>screenMatches.has(id)))continue;
  const b=document.createElement('button');b.className='row';b.dataset.segment=s.segment_id;
  const stamp=document.createElement('div');stamp.className='time';stamp.textContent=`${time(s.start)} to ${time(s.end)}`+(flags.has(s.segment_id)?' · Check speech':'');
  const text=document.createElement('div');text.textContent=s.text;b.append(stamp,text);b.title=flags.get(s.segment_id)||'';
  for(const match of s.caption_matches||[]){const caption=document.createElement('div');caption.className='meta';caption.title=match.track;caption.textContent=`Source captions: ${match.text}`;b.append(caption)}
  b.onclick=()=>seek(s.start);el('passages').append(b);
 }
 for(const [i,s] of data.screens.entries()){if(query&&!screenMatches.has(s.id)&&!data.segments.some(t=>t.screen_ids.includes(s.id)&&t.text.toLowerCase().includes(query)))continue;
  const b=document.createElement('button');b.className='row';b.dataset.screen=s.id;
  b.textContent=`${time(s.start)} · ${s.ocr_text.replaceAll('\n',' ').slice(0,100)||s.id}`;b.onclick=()=>{seek(s.start);showScreen(i)};el('screens').append(b);
 }
 el('empty').hidden=el('passages').children.length>0||el('screens').children.length>0;showScreen(selected);
}
function sync(t){
 let index=data.screens.findIndex(s=>s.start<=t&&t<s.end);if(index>=0&&index!==selected)showScreen(index);
 const segment=data.segments.findIndex(s=>s.start<=t&&t<s.end);if(segment!==currentSegment){currentSegment=segment;document.querySelectorAll('#passages .row').forEach(b=>{const active=Number(b.dataset.segment)===segment;b.classList.toggle('current',active);if(active)el('passages').scrollTop=b.offsetTop-el('passages').offsetTop})}
}
for(const p of [el('video'),el('audio')])p.addEventListener('timeupdate',()=>{if(p===player)sync(p.currentTime+(audioMode?offset:0))});
el('previous').onclick=()=>{showScreen(selected-1);seek(data.screens[selected].start)};
el('next').onclick=()=>{showScreen(selected+1);seek(data.screens[selected].start)};
el('search').oninput=e=>{query=e.target.value.toLowerCase().trim();render()};
el('audioButton').onclick=()=>{let t=player.currentTime+(audioMode?offset:0);player.pause();audioMode=!audioMode;el('playback').open=true;el('video').hidden=audioMode;el('audio').hidden=!audioMode;player=el(audioMode?'audio':'video');seek(t);el('audioButton').textContent=audioMode?'Video':'Audio'};
el('video').addEventListener('error',()=>{el('status').textContent+=' · Video codec unsupported in this browser; use Audio and screen images or open source media externally'});
render();
</script></html>
